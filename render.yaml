services:
  # 1. Redis (State Management)
  - type: redis
    name: ai-agent-redis
    region: singapore
    plan: free
    ipAllowList: [] # Required for security, Render auto-connects internal

  # 2. Backend (FastAPI)
  - type: web
    name: ai-agent-backend
    runtime: docker
    dockerContext: 06-lab-complete/ai-agent
    dockerfilePath: 06-lab-complete/ai-agent/Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: REDIS_URL
        fromService:
          name: ai-agent-redis
          type: redis
          property: connectionString
      - key: AGENT_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://ai-agent-frontend-iw63.onrender.com"

  # 3. Frontend (React/Static)
  - type: web
    name: ai-agent-frontend
    runtime: docker
    dockerContext: 06-lab-complete/ai-agent/frontend
    dockerfilePath: 06-lab-complete/ai-agent/frontend/Dockerfile
    region: singapore
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: /api
      - key: BACKEND_URL
        value: https://ai-agent-backend-j6j5.onrender.com
      - key: BACKEND_HOST
        value: ai-agent-backend-j6j5.onrender.com
      - key: VITE_AGENT_API_KEY
        sync: false
